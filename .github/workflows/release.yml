name: Release Obsidian plugin

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions: read-all

jobs:
  release:
    name: Build and upload release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest version
        if: github.event_name == 'push'
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          TAG_VERSION=${GITHUB_REF_NAME}
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag $TAG_VERSION must match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Create plugin archive
        run: |
          mkdir next-tab-group
          cp main.js manifest.json styles.css next-tab-group/
          zip -r next-tab-group.zip next-tab-group

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.event_name == 'push'
        with:
          files: |
            main.js
            manifest.json
            styles.css
            next-tab-group.zip
